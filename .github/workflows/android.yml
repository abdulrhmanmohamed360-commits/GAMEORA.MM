name: Android CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing. Downloading it..."

            curl -L --fail --retry 3 \
              -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar

            echo "gradle-wrapper.jar downloaded successfully."
          else
            echo "gradle-wrapper.jar already exists."
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties is missing. Creating it..."

            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

            echo "gradle-wrapper.properties created."
          else
            echo "gradle-wrapper.properties already exists."
          fi

          chmod +x gradlew

          echo "Gradle wrapper files:"
          ls -lh gradle/wrapper/
          ls -lh gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gameora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
