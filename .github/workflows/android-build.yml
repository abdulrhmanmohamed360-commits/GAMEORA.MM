name: Android CI Build

# يشتغل تلقائي مع كل push / pull request على main، وبردو تقدر تشغله يدوي من تبويب Actions
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # بيثبت Android SDK (platform-tools + platform 34 + build-tools) ويوافق على
      # اللايسنسات أوتوماتيك، عشان الـ compileSdk 34 المكتوب في app/build.gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # الملف gradle-wrapper.jar ملف باينري كبير مش بيتحط عادي كـ Zip/نص، فبنولده هنا
      # أوتوماتيك بنفس نسخة Gradle المكتوبة في gradle/wrapper/gradle-wrapper.properties (8.7)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Regenerate Gradle wrapper (fixes missing gradle-wrapper.jar)
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
